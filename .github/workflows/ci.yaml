name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out platform library
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.17"
          python-version: "3.12"

      - name: Verify Python
        run: |
          uv sync --frozen --all-groups
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .

version: 1
namespace: curated
bucket: curated
tables:
  sources:
    partitioning: []
    fields:
      - source_id: string
      - display_name: string
      - domain: string
      - enabled: boolean
      - audit_status: string
      - updated_at: timestamp
  articles:
    partitioning: [days(published_at), source_id]
    fields:
      - article_id: string
      - source_id: string
      - source_document_id: string
      - requested_url: string
      - canonical_url: string
      - title: string
      - summary: string
      - author: string
      - published_at: timestamp
      - ingested_at: timestamp
      - ingest_date: date
      - language: string
      - content_hash: string
      - extraction_status: string
  article_feed_memberships:
    partitioning: [days(discovered_at), source_id]
    fields:
      - feed_item_id: string
      - article_id: string
      - run_id: string
      - source_id: string
      - feed_id: string
      - category: string
      - article_url: string
      - discovered_at: timestamp
      - ingest_date: date
      - record_hash: string
  article_url_aliases:
    partitioning: [days(observed_at), source_id]
    fields:
      - article_id: string
      - source_id: string
      - requested_url: string
      - canonical_url: string
      - observed_at: timestamp
  article_text:
    partitioning: [days(published_at), source_id]
    fields:
      - article_id: string
      - source_id: string
      - published_at: timestamp
      - body_text: string
      - cleaned_text: string
      - text_hash: string

version: 1
namespace: landing
bucket: landing
tables:
  feed_items_raw:
    partitioning: [days(discovered_at), source_id]
    fields:
      - feed_item_id: string
      - article_id: string
      - run_id: string
      - source_id: string
      - feed_id: string
      - category: string
      - article_url: string
      - title: string
      - summary: string
      - published_at: timestamp
      - discovered_at: timestamp
      - ingest_date: date
      - payload_uri: string
      - record_hash: string
  source_documents_raw:
    partitioning: [days(fetched_at), source_id]
    fields:
      - source_document_id: string
      - run_id: string
      - article_id: string
      - source_id: string
      - requested_url: string
      - fetched_at: timestamp
      - ingest_date: date
      - payload_uri: string
      - content_type: string
      - content_length_bytes: long
      - content_hash: string
